name: Tests
on: [push]
jobs:

  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: make lint-and-format

  run-tests:
    name: python
    runs-on: ubuntu-latest
    needs: [lint-and-format]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Create .env file
        run: cp .env.local.template .env.local

      - name: Run tests
        env:
          COOKIE_BACKEND_CONFIG_SECRET: fakesecretcoookieof32charrrrrrrr
          FI_KEY_ID: keyId
          FI_PUBLIC_KEY_PEM: |
            -----BEGIN PUBLIC KEY-----
            MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEiE6BySwCPar5xw4ftKWA53oRScxM
            dYTur2ZBpo87ixjtKgixY0IZPPBysY8ji0hqLexMzyPn0awzUcUpzAuV3Q==
            -----END PUBLIC KEY-----
        run: make test

